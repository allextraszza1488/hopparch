# hopparch idle/sleep. Runs on every machine so the screen is always locked
# before any sleep (power menu, laptop lid). Idle sleep itself only happens on
# laptops (idle-sleep.sh checks for a battery).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 10 minutes without input
listener {
    timeout = 600
    on-timeout = ~/.config/scripts/idle-sleep.sh
}
