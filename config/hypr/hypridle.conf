# hopparch idle/sleep, on every machine: the screen locks after 5 min without
# input and before any sleep (power menu, laptop lid). Idle sleep itself only
# happens on laptops (idle-sleep.sh checks for a battery). Apps that ask for it
# (video in Firefox, mpv) hold both off. Gamepad input is not seen as input.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 5 minutes without input: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 minutes without input: laptops sleep
listener {
    timeout = 600
    on-timeout = ~/.config/scripts/idle-sleep.sh
}
