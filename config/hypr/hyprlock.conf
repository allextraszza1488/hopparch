# hopparch lock screen: black, one line of text, password field. Nothing else.
# The text is whatever ~/.config/hopparch/lock-text contains (empty by default;
# your personal setup can put a phrase there).

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(000000ff)
}

label {
    monitor =
    text = cmd[update:60000] cat ~/.config/hopparch/lock-text 2>/dev/null
    font_family = JetBrainsMono Nerd Font
    font_size = 26
    color = rgba(e8e4dcff)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    rounding = 0
    outline_thickness = 2
    outer_color = rgba(e8e4dcff)
    inner_color = rgba(000000ff)
    font_color = rgba(e8e4dcff)
    check_color = rgba(e8e4dcff)
    fail_color = rgba(c23d3dff)
    fade_on_empty = false
    placeholder_text =
    fail_text = wrong
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}
