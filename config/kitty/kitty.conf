# hopparch kitty: 0xyc colors. No tabs/splits -- Hyprland and nvim do that.
font_family      JetBrainsMono Nerd Font
font_size        12
# These are not in the terminal font, or the terminal draws the stacked
# marks in their own cells. Pull them from fonts that actually contain them.
symbol_map U+02F6,U+0296,U+0361,U+035C,U+1D54-U+1D55,U+2038 Noto Serif
symbol_map U+0CA0 Noto Sans Kannada
symbol_map U+0E07 Noto Sans Thai
symbol_map U+1564,U+1566 Noto Sans Canadian Aboriginal
symbol_map U+25DE,U+25DF,U+261E,U+2661 Adwaita Mono

background           #000000
foreground           #E8E4DC
cursor               #E8E4DC
selection_background #2A2A28
selection_foreground #E8E4DC

window_padding_width    4
enable_audio_bell       no
confirm_os_window_close 0

clear_all_shortcuts yes
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
# scrollback from the keyboard (vim-style, no PgUp/PgDn needed)
map ctrl+shift+u     scroll_page_up
map ctrl+shift+d     scroll_page_down
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
