# hopparch btop. Apps are a tree: a program and everything it started sit
# together, and the parent row shows their combined CPU and memory.
# Kernel threads are hidden. f filters by name, Enter opens one process,
# o is the menu, Esc leaves it.
shown_boxes = "cpu mem net proc"
proc_tree = true
proc_aggregate = true
proc_filter_kernel = true
proc_colors = true
proc_gradient = true
proc_mem_bytes = true
proc_cpu_graphs = true
proc_per_core = false
proc_sorting = "cpu lazy"
cpu_single_graph = false
show_uptime = true
update_ms = 1000
theme_background = false
vim_keys = false
